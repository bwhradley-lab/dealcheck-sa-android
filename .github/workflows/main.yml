name: Build DealCheck SA Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run:                 run: /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/za/co/dealchecksa/app
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'DealCheckSA'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'za.co.dealchecksa.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'za.co.dealchecksa.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv('DEALCHECK_STORE_FILE'))
                      storePassword System.getenv('DEALCHECK_KEY_PASSWORD')
                      keyAlias 'upload'
                      keyPassword System.getenv('DEALCHECK_KEY_PASSWORD')
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF

          : > app/proguard-rules.pro

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="DealCheck SA"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.DealCheckSA"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/za/co/dealchecksa/app/MainActivity.java <<'EOF'
          package za.co.dealchecksa.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private static final int FILE_CHOOSER_REQUEST = 101;
              private static final String APP_HOST = "dealcheck-sa.dusky-park-8791.chatgpt.site";
              private static final String APP_URL = "https://" + APP_HOST;
              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.rgb(8, 15, 28));
                  getWindow().getDecorView().setSystemUiVisibility(0);

                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  settings.setUserAgentString(settings.getUserAgentString() + " DealCheckSA/1.0");

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          Uri uri = Uri.parse(url);
                          if (APP_HOST.equalsIgnoreCase(uri.getHost())) return false;
                          startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          return true;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback,
                                                       FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;
                          Intent intent = params.createIntent();
                          try {
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST);
                          } catch (Exception error) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  if (savedInstanceState == null) webView.loadUrl(APP_URL);
                  else webView.restoreState(savedInstanceState);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_REQUEST && fileCallback != null) {
                      fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                      fileCallback = null;
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">DealCheck SA</string>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="navy">#08101D</color>
              <color name="teal">#16C7B7</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.DealCheckSA" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">@color/navy</item>
                  <item name="android:navigationBarColor">@color/navy</item>
                  <item name="android:windowBackground">@color/navy</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#08101D" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#16C7B7" android:pathData="M16,30h76v48h-76z" />
              <path android:fillColor="#08101D" android:pathData="M24,38h60v32h-60z" />
              <path android:fillColor="#FFFFFF" android:pathData="M34,47h40v6h-40zM34,58h28v6h-28z" />
          </vector>
          EOF

          cat > app/src/main/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="false" />
          </network-security-config>
          EOF

      - name: Create protected upload key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing release-pack
          KEY_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEY_PASSWORD"
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/signing/dealcheck-upload.keystore" \
            -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=DealCheck SA, O=DealCheck SA, C=ZA"
          printf '%s\n' "$KEY_PASSWORD" > release-pack/upload-key-password.txt
          cp signing/dealcheck-upload.keystore release-pack/
          {
            echo "DEALCHECK_STORE_FILE=$GITHUB_WORKSPACE/signing/dealcheck-upload.keystore"
            echo "DEALCHECK_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed app bundle
        run: gradle --no-daemon :app:bundleRelease

      - name: Prepare release files
        shell: bash
        run: |
          cp app/build/outputs/bundle/release/app-release.aab release-pack/DealCheck-SA-v1.0.0.aab
          sha256sum release-pack/DealCheck-SA-v1.0.0.aab > release-pack/SHA256.txt
          cat > release-pack/IMPORTANT.txt <<'EOF'
          Upload DealCheck-SA-v1.0.0.aab to Google Play Console.
          Keep dealcheck-upload.keystore and upload-key-password.txt permanently safe.
          They are required to sign every future DealCheck SA update.
          Never publish or share the keystore or password.
          EOF

      - name: Upload DealCheck release pack
        uses: actions/upload-artifact@v4
        with:
          name: DealCheck-SA-Android-Release-Pack
          path: release-pack/
          retention-days: 30
          if-no-files-found: error
